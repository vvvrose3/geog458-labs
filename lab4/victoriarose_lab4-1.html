<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 4 — Pittsburgh trees</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
  <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    mapboxgl.accessToken = 'pk.eyJ1IjoidnZ2cm9zZTMiLCJhIjoiY211d3o2cWtuMDM4bTJ5b2J1ZzFkbnF5MiJ9.zohqJ3O5rBZqHsdbcDcwnQ';
    const map = new mapboxgl.Map({
      container: 'map',
    style: 'mapbox://styles/mapbox/light-v11',
      projection: 'globe',
      center: [-79.999732, 40.4374],
      zoom: 11,
      maxZoom: 15
    });

    map.addControl(new mapboxgl.FullscreenControl());
    map.addControl(new mapboxgl.NavigationControl());

    // This callback runs after the map style is ready. Keep its braces.
    map.on('load', () => {
      map.setFog({});

    map.addSource('trees', {
        type: 'geojson',
        data: 'data/trees.geojson'
    });

      map.addLayer({
        'id': "trees-heat",
        'type': "heatmap",
        'source': "trees",
        'maxzoom': 15,
        'paint': {
            'heatmap-weight': {
            'property': "dbh",
            'type': "exponential",
            'stops': [[1, 0], [62, 1]]
            },
            'heatmap-intensity': {
            'stops': [[11, 0.5], [15, 3]]
            },
            'heatmap-color': [
            "interpolate", ["linear"], ["heatmap-density"],
                0, "rgba(146,153,155,0)",
                0.2, "rgb(115,140,120)",
                0.4, "rgb(157,201,153)",
                0.6, "rgb(75,155,104)",
                0.8, "rgb(17,92,61)"
            ],
            'heatmap-radius': {
            'stops': [[11, 8], [15, 20]]
            },
            'heatmap-opacity': {
            'default': 1,
            'stops': [[14, 1], [15, 0]]
            }
        }
        });

      map.addLayer({
        'id': "trees-point",
        'type': "circle",
        'source': "trees",
        'minzoom': 14,
        'paint': {
            'circle-radius': {
            'property': "dbh",
            'type': "exponential",
            'stops': [
                [{ 'zoom': 15, 'value': 1 }, 4],
                [{ 'zoom': 15, 'value': 62 }, 9],
                [{ 'zoom': 22, 'value': 1 }, 8],
                [{ 'zoom': 22, 'value': 62 }, 20]
            ]
            },
            'circle-color': {
            'property': "dbh",
            'type': "exponential",
            'stops': [
                [0, "rgba(0,0,0,0)"],
                [10, "rgb(200,240,200)"],
                [20, "rgb(160,225,160)"],
                [30, "rgb(120,205,120)"],
                [40, "rgb(75,180,95)"],
                [50, "rgb(35,145,70)"],
                [60, "rgb(10,110,50)"]
            ]
            },
            'circle-stroke-color': "rgba(43,79,56,0.8)",
            'circle-stroke-width': 1.3,
            'circle-stroke-opacity': {      // cleaner transition
                'stops': [[14, 0], [15, 1]]
            },
            'circle-opacity': {
            'stops': [[14, 0], [15, 1]]
            }
        }
        });

      map.on('click', 'trees-point', (event) => {
  new mapboxgl.Popup()
        .setLngLat(event.features[0].geometry.coordinates)
        .setHTML(`<strong>DBH:</strong> ${event.features[0].properties.dbh}`)
        .addTo(map);
    });
    });
  </script>
</body>
</html>
